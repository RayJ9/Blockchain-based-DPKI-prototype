enablePushSubscribe=false
# 推送名称
pushName="chain33"
# 推送绑定地址
pushBind="127.0.0.1:9999"

[p2p]
# 是否启动P2P网络,默认true
enable=true
# P2P网络监听端口
port=13802
# 种子节点，格式为ip:port，多个节点以逗号分隔
seeds=[]
# 数据目录
datadir="datadir"
# 最大连接数
maxConnNum=50
# 最小连接数
minConnNum=1
# 是否为种子节点
isSeed=false
# 是否启用中继
enableRelay=true
# 中继跳数
relayHop=1
# 是否启用DHT
enableDHT=true
# DHT模式，0为客户端模式，1为服务端模式
DHTDataMode=1
# 引导节点
bootNodes=[]
# 是否启用mDNS发现
enableMDNS=false
# mDNS服务名
MDNSInterval=5

[rpc]
# 是否开启https
enableTLS=false
# 证书文件，支持证书路径，以及证书内容,如果启动https，必须设置
certFile=""
# 私钥文件，支持私钥路径，以及私钥内容,如果启动https，必须设置  
keyFile=""
# RPC模块开关，wallet,ticket,trade,paracross,multisig
jrpcFuncWhitelist=["*"]
grpcFuncWhitelist=["*"]
# jrpc绑定地址
jrpcBindAddr="0.0.0.0:8801"
# grpc绑定地址  
grpcBindAddr="0.0.0.0:8802"
# 白名单列表，允许访问的IP地址，*表示允许所有IP访问
whitelist=["*"]
# jrpc请求白名单，默认是*,允许访问所有的rpc接口
jrpcFuncWhitelist=["*"]
# grpc请求白名单，默认是*,允许访问所有的rpc接口
grpcFuncWhitelist=["*"]
# 是否开启跨域访问
enableCors=true
# 跨域访问的域名列表
