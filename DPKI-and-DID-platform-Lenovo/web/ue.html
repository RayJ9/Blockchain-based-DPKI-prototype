<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UE管理 - DPKI平台</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="language-switch.css">
    <script src="language.js"></script>
    <style>
        .list-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .list-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            text-align: center;
        }
        
        .list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .list-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .list-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .item-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .item-status {
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        
        .status-active {
            background: #4CAF50;
            color: white;
        }
        
        .status-inactive {
            background: #f44336;
            color: white;
        }
        
        .status-certified {
            background: #2196F3;
            color: white;
        }
        
        .status-pending {
            background: #FF9800;
            color: white;
        }
        
        .status-created {
            background: #9E9E9E;
            color: white;
        }
        
        .item-path {
            font-size: 0.9em;
            color: #ccc;
            word-break: break-all;
        }
        
        .logs-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #fff;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #2196F3;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .log-timestamp {
            color: #888;
            font-size: 0.8em;
        }
        
        .log-message {
            margin-top: 3px;
        }
        
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
        }
        
        .nav-link {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .update-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .update-section h3 {
            color: #fff;
            margin-bottom: 15px;
        }
        .function-title-with-timing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .timing-display {
            font-size: 0.9em;
            color: #333;
            font-weight: normal;
        }
        
        .timing-active {
            color: #4CAF50;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header">
            <h1 data-lang-key="platform_title">DPKI管理平台</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-lang-key="nav_home">首页</a>
                <a href="ca.html" class="nav-link" data-lang-key="nav_ca">CA管理</a>
                <a href="ue.html" class="nav-link active" data-lang-key="nav_ue">UE管理</a>
                <a href="did.html" class="nav-link" data-lang-key="nav_did">DID平台</a>
            </div>
        </div>

        <!-- CA列表 -->
        <div class="list-section">
            <div class="list-title" data-lang-key="ca_list_title">CA列表</div>
            <div id="caList" class="list-container">
                <div class="list-item">
                    <div class="item-name" data-lang-key="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- UE列表 -->
        <div class="list-section">
            <div class="list-title" data-lang-key="ue_list_title">UE列表</div>
            <div id="ueList" class="list-container">
                <div class="list-item">
                    <div class="item-name" data-lang-key="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- UE服务器控制 -->
        <div class="panel" style="display: none;">
            <h2 data-lang-key="ue_server_control">UE服务器控制</h2>
            <div class="server-control">
                <div class="server-status">
                    <span data-lang-key="ue_server_status">UE服务器状态: </span>
                    <span id="ueStatus" class="status-indicator" data-lang-key="checking">检查中...</span>
                </div>
                <div class="server-buttons">
                    <button id="startUeBtn" class="btn btn-success" data-lang-key="start_ue_server">启动UE服务器</button>
                    <button id="stopUeBtn" class="btn btn-danger" data-lang-key="stop_ue_server">停止UE服务器</button>
                </div>
            </div>
        </div>

        <!-- UE功能 -->
        <div class="panel">
            <h2 data-lang-key="ue_functions">UE功能</h2>
            
            <!-- 左右分栏布局 -->
            <div class="function-layout">
                <!-- 左侧操作区 -->
                <div class="function-left">
                    <div class="function-group">
                        <div class="function-title-with-timing">
                            <h3 data-lang-key="initiate_csr_request">发起CSR请求</h3>
                            <span id="timing-requestCsr" class="timing-display"></span>
                        </div>
                        <div class="form-group">
                            <input type="text" id="csrUeName" data-lang-placeholder="ue_name_placeholder" placeholder="UE名称" class="form-input">
                            <button id="requestCsrBtn" class="btn btn-primary" data-lang-key="initiate_csr">发起CSR请求</button>
                        </div>
                    </div>

                    <div class="function-group">
                        <div class="function-title-with-timing">
                            <h3 data-lang-key="ue_authentication">UE间认证</h3>
                            <span id="timing-authRequest" class="timing-display"></span>
                        </div>
                        <div class="form-group">
                            <input type="text" id="authUeName" data-lang-placeholder="ue_name_placeholder" placeholder="UE名称" class="form-input">
                            <button id="authRequestBtn" class="btn btn-primary" data-lang-key="initiate_auth_request">发起认证请求</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧消息回执区 -->
                <div class="function-right">
                    <h3 data-lang-key="operation_receipt">操作回执</h3>
                    <div id="ueResponseArea" class="response-area">
                        <div class="response-placeholder" data-lang-key="operation_result_placeholder">操作结果将在此显示...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- UE系统日志 -->
        <div class="panel">
            <h2 data-lang-key="ue_system_logs">UE系统日志</h2>
            <div id="ueSystemLogs" class="logs-container">
                <!-- UE日志内容将在这里动态加载 -->
            </div>
        </div>
    </div>

    <script src="ue.js"></script>
</body>
</html>
