<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DID平台 - 去中心化身份管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="language-switch.css">
    <script src="language.js"></script>
    <style>
        .nav-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: #e0e0e0;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .nav-link.active {
            background: rgba(74, 144, 226, 0.3);
            color: white;
        }

        .page-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            margin: 40px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .service-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            font-size: 1.4em;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .display-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .display-item-title {
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .display-item-content {
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
            max-height: 100px;
            overflow-y: auto;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: white;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .input-field option {
            background: rgba(30, 30, 30, 0.95);
            color: white;
            padding: 8px;
        }

        .input-field select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        /* VC签发表单布局 */
        .vc-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .vc-form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .input-field::placeholder {
            color: #bbb;
        }

        .textarea-field {
            width: 100%;
            min-height: 120px;
            max-height: 200px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
            overflow-y: auto;
        }

        .textarea-field::placeholder {
            color: #bbb;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .copy-btn {
            padding: 8px 12px;
            font-size: 0.9em;
            min-width: 60px;
        }

        .result-area {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .relation-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .relation-did {
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .relation-vcs {
            color: #e0e0e0;
            font-size: 0.9em;
        }

        .vc-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        .vc-content {
            word-break: break-all;
            white-space: pre-wrap;
            font-size: 0.85em;
            line-height: 1.4;
            max-height: 60px;
            overflow-y: auto;
            padding-right: 80px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .vc-content::-webkit-scrollbar {
            width: 8px;
        }

        .vc-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .vc-content::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.6);
            border-radius: 4px;
        }

        .vc-content::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.8);
        }

        .copy-vc-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            font-size: 0.8em;
            background: rgba(102, 126, 234, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-vc-btn:hover {
            background: rgba(102, 126, 234, 1);
            transform: translateY(-1px);
        }

        .copy-did-btn {
            margin-left: 10px;
            padding: 4px 8px;
            font-size: 0.8em;
            background: rgba(102, 126, 234, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-did-btn:hover {
            background: rgba(102, 126, 234, 1);
            transform: translateY(-1px);
        }

        .revoke-vc-btn {
            position: absolute;
            top: 8px;
            right: 50px;
            padding: 4px 8px;
            font-size: 0.8em;
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .revoke-vc-btn:hover {
            background: rgba(220, 53, 69, 1);
            transform: translateY(-1px);
        }
        
        /* 时延统计样式 */
        .function-title-with-timing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .timing-display {
            font-size: 0.8em;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        
        .timing-display.timing-active {
            color: #FF9800;
            background: rgba(255, 152, 0, 0.1);
            border-color: rgba(255, 152, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <div class="nav-header">
            <h1 data-lang-key="did_platform_title">DID平台</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-lang-key="nav_home">首页</a>
                <a href="ca.html" class="nav-link" data-lang-key="nav_ca">DPKI平台</a>
                <a href="did.html" class="nav-link active" data-lang-key="nav_did">DID平台</a>
            </div>
        </div>

        <!-- DID服务状态 -->
        <!-- 已移除服务状态显示 -->

        <!-- 大标题 -->
        <div class="page-title" data-lang-key="did_platform_title">去中心化身份管理平台</div>

        <!-- 1. DID/VC展示区域 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="did_vc_relationship_title">📊 DID/VC 关系展示</span>
                </div>
            </div>
            <div id="didVcRelations">
                <div class="relation-item">
                    <div class="relation-did" data-lang-key="no_did_data">暂无DID数据</div>
                    <div class="relation-vcs" data-lang-key="generate_did_vc_first">请先生成DID和VC</div>
                </div>
            </div>
        </div>

        <!-- 2. DID生成 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="did_generation_title">🆔 DID生成</span>
                    <span class="timing-display" id="generateDidTiming">-</span>
                </div>
            </div>
            <div class="input-group">
                <div class="input-row">
                    <button class="btn btn-primary" onclick="generateDID()" data-lang-key="generate_did_button">生成新DID</button>
                    <button class="btn btn-secondary copy-btn" onclick="copyDID()" data-lang-key="copy_button">复制</button>
                </div>
            </div>
            <div class="result-area" id="didResult" data-lang-key="did_generation_placeholder">点击"生成新DID"按钮开始</div>
        </div>

        <!-- 3. DID文档查询 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="did_query_title">🔍 DID文档查询</span>
                    <span class="timing-display" id="queryDidTiming">-</span>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label" data-lang-key="input_did">输入DID:</label>
                <div class="input-row">
                    <input type="text" class="input-field" id="queryDID" placeholder="输入要查询的DID" data-lang-placeholder="did_query_placeholder">
                    <button class="btn btn-primary" onclick="queryDIDDocument()" data-lang-key="query_did_button">查询文档</button>
                </div>
            </div>
            <div class="result-area" id="didDocResult" data-lang-key="did_query_result_placeholder">查询结果将显示在这里</div>
        </div>

        <!-- 4. VC签发 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="vc_generation_title">📜 可验证凭证(VC)签发</span>
                    <span class="timing-display" id="generateVcTiming">-</span>
                </div>
            </div>
            <div class="vc-form-row">
                <div class="input-group">
                    <label class="input-label" data-lang-key="vc_did_label">DID:</label>
                    <input type="text" class="input-field" id="vcDID" placeholder="输入DID" data-lang-placeholder="vc_did_placeholder">
                </div>
                <div class="input-group">
                    <label class="input-label" data-lang-key="vc_permission_label">操作权限:</label>
                    <select class="input-field" id="operatorPermission">
                        <option value="read" data-lang-key="permission_read">read</option>
                        <option value="write" data-lang-key="permission_write">write</option>
                        <option value="admin" data-lang-key="permission_admin">admin</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <div class="input-row">
                    <button class="btn btn-primary" onclick="generateVC()" data-lang-key="generate_vc_button">签发VC</button>
                    <button class="btn btn-secondary copy-btn" onclick="copyVC()" data-lang-key="copy_button">复制</button>
                </div>
            </div>
            <textarea class="textarea-field" id="vcResult" placeholder="VC将显示在这里" data-lang-placeholder="vc_generation_result_placeholder" readonly></textarea>
        </div>

        <!-- 5. VC解析与验证 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="vc_verification_title">🔐 VC解析与验证</span>
                    <span class="timing-display" id="parseVerifyVcTiming">-</span>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label" data-lang-key="vc_jwt_label">VC JWT:</label>
                <textarea class="textarea-field" id="vcJWT" placeholder="粘贴VC JWT字符串" data-lang-placeholder="vc_jwt_placeholder"></textarea>
            </div>
            <div class="input-group">
                <button class="btn btn-primary" onclick="parseAndVerifyVC()" data-lang-key="parse_verify_vc_button">解析并验证VC</button>
            </div>
            <div class="result-area" id="vcParseVerifyResult" data-lang-key="vc_verification_result_placeholder">解析和验证结果将显示在这里</div>
        </div>

        <!-- 6. VC撤销管理 -->
        <div class="section">
            <div class="section-title">
                <div class="function-title-with-timing">
                    <span data-lang-key="vc_revocation_title">🚫 VC撤销管理</span>
                    <span class="timing-display" id="revokeVcTiming">-</span>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label" data-lang-key="revoke_vc_jwt">要撤销的VC JWT:</label>
                <textarea class="textarea-field" id="revokeVcJWT" placeholder="粘贴要撤销的VC JWT字符串" data-lang-placeholder="vc_jwt_revoke_placeholder"></textarea>
            </div>
            <div class="input-group">
                <button class="btn btn-danger" onclick="revokeVCManual()" data-lang-key="revoke_vc_button">撤销VC</button>
            </div>
            <div class="result-area" id="revokeResult" data-lang-key="vc_revocation_result_placeholder">撤销结果将显示在这里</div>
        </div>
    </div>

    <script src="did.js"></script>
    <script>
        // 存储DID和VC的关系数据
        let didVcData = {};

        // 更新DID/VC关系展示
        function updateDIDVCDisplay() {
            const container = document.getElementById('didVcRelations');
            if (Object.keys(didVcData).length === 0) {
                container.innerHTML = `
                    <div class="relation-item">
                        <div class="relation-did" data-lang-key="no_did_data">暂无DID数据</div>
                        <div class="relation-vcs" data-lang-key="generate_did_vc_first">请先生成DID和VC</div>
                    </div>
                `;
                // 应用语言设置到新添加的元素
                if (window.languageManager) {
                    window.languageManager.updatePageTexts();
                }
                return;
            }

            let html = '';
            for (const [did, vcs] of Object.entries(didVcData)) {
                html += `
                    <div class="relation-item">
                        <div class="relation-did">
                            DID: ${did}
                            <button class="copy-did-btn" onclick="copyToClipboard('${did}')">Copy</button>
                        </div>
                        <div class="relation-vcs">
                            ${vcs.length > 0 ? 
                                vcs.map((vc, index) => `
                                    <div class="vc-item">
                                        <div class="vc-content">VC: ${vc}</div>
                                    </div>
                                `).join('') :
                                '<div class="vc-item"><div class="vc-content">' + (window.languageManager ? window.languageManager.getText('no_associated_vc') : '暂无关联的VC') + '</div></div>'
                            }
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 复制功能
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = window.languageManager ? window.languageManager.getText(message) : message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('copied_to_clipboard');
            }).catch(err => {
                alert(window.languageManager ? window.languageManager.getText('copy_failed') + ': ' + err.message : '复制失败: ' + err.message);
            });
        }

        function copyDID() {
            const didResult = document.getElementById('didResult').textContent;
            const placeholder = window.languageManager ? window.languageManager.getText('click_generate_did_start') : '点击"生成新DID"按钮开始';
            if (didResult && didResult !== placeholder) {
                navigator.clipboard.writeText(didResult).then(() => {
                    alert(window.languageManager ? window.languageManager.getText('did_copied') : 'DID已复制到剪贴板');
                }).catch(err => {
                    alert(window.languageManager ? window.languageManager.getText('copy_failed') + ': ' + err.message : '复制失败: ' + err.message);
                });
            }
        }

        function copyVC() {
            const vcResult = document.getElementById('vcResult').value;
            if (vcResult) {
                navigator.clipboard.writeText(vcResult).then(() => {
                    alert(window.languageManager ? window.languageManager.getText('vc_copied') : 'VC已复制到剪贴板');
                }).catch(err => {
                    alert(window.languageManager ? window.languageManager.getText('copy_failed') + ': ' + err.message : '复制失败: ' + err.message);
                });
            }
        }

        // 合并解析和验证功能
        async function parseAndVerifyVC() {
            const jwtString = document.getElementById('vcJWT').value.trim();
            if (!jwtString) {
                alert(window.languageManager ? window.languageManager.getText('please_input_vc_jwt') : '请输入VC JWT字符串');
                return;
            }

            timingTracker.start('parseVerifyVc');
            try {
                // 解析VC
                const parseResponse = await fetch(`/api/vc/parse?jwtString=${encodeURIComponent(jwtString)}`);
                const parseResult = await parseResponse.json();
                
                // 添加600ms间隔
                await new Promise(resolve => setTimeout(resolve, 600));
                
                const verifyResponse = await fetch(`/api/vc/verify?jwtString=${encodeURIComponent(jwtString)}`);
                const verifyResult = await verifyResponse.json();

                // 显示结果
                const resultDiv = document.getElementById('vcParseVerifyResult');
                const parseText = window.languageManager ? window.languageManager.getText('parsing_result') : '解析结果';
                const verifyText = window.languageManager ? window.languageManager.getText('verification_result') : '验证结果';
                resultDiv.textContent = `${parseText}:\n${JSON.stringify(parseResult, null, 2)}\n\n${verifyText}:\n${JSON.stringify(verifyResult, null, 2)}`;
                
                // 根据验证结果更新时延显示
                let statusText = '';
                let statusColor = '';
                
                // 检查验证结果
                if (verifyResult && verifyResult.data) {
                    // 处理 data 为布尔值的情况
                    if (typeof verifyResult.data === 'boolean') {
                        if (verifyResult.data === true) {
                            statusText = window.languageManager ? window.languageManager.getText('success') : '成功';
                            statusColor = '#28a745'; // 绿色
                        } else {
                            // 检查结果中是否包含撤销信息
                            const resultString = JSON.stringify(verifyResult);
                            if (resultString.includes('撤销') || resultString.includes('revoke')) {
                                statusText = window.languageManager ? window.languageManager.getText('revoked') : '已撤销';
                                statusColor = '#ffc107'; // 黄色
                            } else {
                                statusText = window.languageManager ? window.languageManager.getText('verification failed') : '验证失败';
                                statusColor = '#dc3545'; // 红色
                            }
                        }
                    }
                    // 处理 data 为对象且包含 valid 字段的情况
                    else if (typeof verifyResult.data === 'object' && verifyResult.data.hasOwnProperty('valid')) {
                        if (verifyResult.data.valid === true) {
                            statusText = window.languageManager ? window.languageManager.getText('success') : '成功';
                            statusColor = '#28a745'; // 绿色
                        } else {
                            // 检查结果中是否包含撤销信息
                            const resultString = JSON.stringify(verifyResult);
                            if (resultString.includes('撤销') || resultString.includes('revoke')) {
                                statusText = window.languageManager ? window.languageManager.getText('revoked') : '已撤销';
                                statusColor = '#ffc107'; // 黄色
                            } else {
                                statusText = window.languageManager ? window.languageManager.getText('verification failed') : '验证失败';
                                statusColor = '#dc3545'; // 红色
                            }
                        }
                    }
                    // 其他情况默认为失败
                    else {
                        // 检查结果中是否包含撤销信息
                        const resultString = JSON.stringify(verifyResult);
                        if (resultString.includes('撤销') || resultString.includes('revoke')) {
                            statusText = window.languageManager ? window.languageManager.getText('revoked') : '已撤销';
                            statusColor = '#ffc107'; // 黄色
                        } else {
                            statusText = window.languageManager ? window.languageManager.getText('verification failed') : '验证失败';
                            statusColor = '#dc3545'; // 红色
                        }
                    }
                } else {
                    // 没有验证结果或结果为空，默认为失败
                    statusText = window.languageManager ? window.languageManager.getText('verification failed') : '验证失败';
                    statusColor = '#dc3545'; // 红色
                }
                
                // 更新时延显示，包含验证状态和颜色
                const timingElement = document.getElementById('parseVerifyVcTiming');
                if (timingElement && timingTracker.timings['parseVerifyVc']) {
                    const duration = Date.now() - timingTracker.timings['parseVerifyVc'].startTime;
                    timingElement.textContent = `${duration}ms - ${statusText}`;
                    timingElement.style.color = statusColor;
                    timingElement.classList.remove('timing-active');
                }
            } catch (error) {
                const errorText = window.languageManager ? window.languageManager.getText('error') : '错误';
                document.getElementById('vcParseVerifyResult').textContent = `${errorText}: ${error.message}`;
                
                // 错误情况下的时延显示
                const timingElement = document.getElementById('parseVerifyVcTiming');
                if (timingElement && timingTracker.timings['parseVerifyVc']) {
                    const duration = Date.now() - timingTracker.timings['parseVerifyVc'].startTime;
                    const errorStatusText = window.languageManager ? window.languageManager.getText('error') : '错误';
                    timingElement.textContent = `${duration}ms - ${errorStatusText}`;
                    timingElement.classList.remove('timing-active');
                }
            }
        }

        // DID文档查询
        async function queryDIDDocument() {
            const didInput = document.getElementById('queryDID').value.trim();
            const resultDiv = document.getElementById('didDocResult');
            
            if (!didInput) {
                const errorMsg = window.languageManager ? window.languageManager.getText('please_input_did') : '请输入DID';
                alert(errorMsg);
                return;
            }
            
            timingTracker.start('queryDid');
            try {
                const queryingMsg = window.languageManager ? window.languageManager.getText('querying_did') : '正在查询DID文档...';
                resultDiv.textContent = queryingMsg;
                
                const response = await fetch('/api/did/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ did: didInput })
                });
                const result = await response.json();
                
                resultDiv.textContent = JSON.stringify(result, null, 2);
                timingTracker.end('queryDid');
            } catch (error) {
                console.error('查询DID文档失败:', error);
                const errorMsg = window.languageManager ? window.languageManager.getText('error') : '错误';
                resultDiv.textContent = `${errorMsg}: ${error.message}`;
                timingTracker.end('queryDid');
            }
        }

        // 重写生成DID函数以更新关系数据
        async function generateDID() {
            const didInput = document.getElementById('vcDID').value.trim();
            const permissionInput = document.getElementById('operatorPermission').value.trim();
            const enabledInput = 'true';
            
            timingTracker.start('generateDid');
            try {
                const generatingMsg = window.languageManager ? window.languageManager.getText('generating_did') : '正在生成DID...';
                document.getElementById('didResult').textContent = generatingMsg;
                
                const response = await fetch('/api/did/create');
                const result = await response.json();
                
                if (result.code === 1) {
                    const newDid = result.data;
                    document.getElementById('didResult').textContent = newDid;
                    
                    // 添加到DID数据中
                    if (!didVcData[newDid]) {
                        didVcData[newDid] = [];
                    }
                    updateDIDVCDisplay();
                    timingTracker.end('generateDid');
                } else {
                    const errorMsg = window.languageManager ? window.languageManager.getText('error') : '错误';
                    document.getElementById('didResult').textContent = `${errorMsg}: ${result.msg}`;
                    timingTracker.end('generateDid');
                }
            } catch (error) {
                const errorMsg = window.languageManager ? window.languageManager.getText('error') : '错误';
                document.getElementById('didResult').textContent = `${errorMsg}: ${error.message}`;
                timingTracker.end('generateDid');
            }
        }

        // 重写生成VC函数以更新关系数据
        async function generateVC() {
            const didInput = document.getElementById('vcDID').value.trim();
            const permissionInput = document.getElementById('operatorPermission').value.trim();
            const enabledInput = 'true';
            
            if (!didInput) {
                const errorMsg = window.languageManager ? window.languageManager.getText('please_fill_did_identifier') : '请填写DID标识符';
                document.getElementById('vcResult').value = errorMsg;
                return;
            }
            
            // 检查DID是否包含"omni"字符串
            if (!didInput.includes('omni')) {
                const errorMsg = window.languageManager ? window.languageManager.getText('did_must_contain_omni') : 'DID必须包含"omni"字符串';
                document.getElementById('vcResult').value = errorMsg;
                return;
            }
            
            timingTracker.start('generateVc');
            try {
                const generatingMsg = window.languageManager ? window.languageManager.getText('generating_vc') : '正在签发可验证凭证...';
                document.getElementById('vcResult').value = generatingMsg;
                
                // 添加200ms前端间隔
                await new Promise(resolve => setTimeout(resolve, 200));
                
                const response = await fetch(`/api/vc/user-attribute?did=${encodeURIComponent(didInput)}&operatorPermission=${encodeURIComponent(permissionInput)}&enabled=${encodeURIComponent(enabledInput)}`, {
                    method: 'GET'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.code === 1) {
                    const newVc = result.data;
                    document.getElementById('vcResult').value = newVc;
                    
                    // 添加到VC数据中，避免重复
                    if (!didVcData[didInput]) {
                        didVcData[didInput] = [];
                    }
                    if (!didVcData[didInput].includes(newVc)) {
                        didVcData[didInput].push(newVc);
                    }
                    updateDIDVCDisplay();
                    timingTracker.end('generateVc');
                } else {
                    const errorMsg = window.languageManager ? window.languageManager.getText('error') : '错误';
                    document.getElementById('vcResult').value = `${errorMsg}: ${result.msg}`;
                    timingTracker.end('generateVc');
                }
            } catch (error) {
                const errorMsg = window.languageManager ? window.languageManager.getText('error') : '错误';
                document.getElementById('vcResult').value = `${errorMsg}: ${error.message}`;
                timingTracker.end('generateVc');
            }
        }

        // 撤销VC功能
        async function revokeVC(vcJwt, index) {
            if (!confirm('确定要撤销这个VC吗？撤销后将无法恢复。')) {
                return;
            }

            timingTracker.start('revokeVc');
            try {
                // 添加800ms间隔
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const response = await fetch('/api/vc/revoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        vcJwt: vcJwt,
                        reason: '用户手动撤销'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('VC撤销成功');
                    
                    // 从didVcData中移除撤销的VC
                    for (const did in didVcData) {
                        const vcIndex = didVcData[did].indexOf(vcJwt);
                        if (vcIndex !== -1) {
                            didVcData[did].splice(vcIndex, 1);
                            break;
                        }
                    }
                    
                    // 更新显示
                    updateDIDVCDisplay();
                    
                    // 更新时延显示
                    const timingElement = document.getElementById('revokeVcTiming');
                    if (timingElement && timingTracker.timings['revokeVc']) {
                        const duration = Date.now() - timingTracker.timings['revokeVc'].startTime;
                        timingElement.textContent = `${duration}ms - ${window.languageManager ? window.languageManager.getText('success') : '成功'}`;
                        timingElement.classList.remove('timing-active');
                    }
                } else {
                    alert('撤销失败: ' + result.message);
                    
                    // 更新时延显示
                    const timingElement = document.getElementById('revokeVcTiming');
                    if (timingElement && timingTracker.timings['revokeVc']) {
                        const duration = Date.now() - timingTracker.timings['revokeVc'].startTime;
                        timingElement.textContent = `${duration}ms - ${window.languageManager ? window.languageManager.getText('revoke_failed') : '撤销失败'}`;
                        timingElement.classList.remove('timing-active');
                    }
                }
            } catch (error) {
                alert('撤销失败: ' + error.message);
                
                // 错误情况下的时延显示
                const timingElement = document.getElementById('revokeVcTiming');
                if (timingElement && timingTracker.timings['revokeVc']) {
                    const duration = Date.now() - timingTracker.timings['revokeVc'].startTime;
                    timingElement.textContent = `${duration}ms - ${window.languageManager ? window.languageManager.getText('error') : '错误'}`;
                    timingElement.classList.remove('timing-active');
                }
            }
        }

        // 手动撤销VC功能
        async function revokeVCManual() {
            const vcJwt = document.getElementById('revokeVcJWT').value.trim();
            const resultDiv = document.getElementById('revokeResult');
            
            if (!vcJwt) {
                const errorMsg = window.languageManager ? window.languageManager.getText('please_input_vc_jwt') : '请输入要撤销的VC JWT';
                resultDiv.innerHTML = `<div style="color: #ff6b6b;">${errorMsg}</div>`;
                return;
            }

            const confirmMsg = window.languageManager ? window.languageManager.getText('confirm_revoke_vc') : '确定要撤销这个VC吗？撤销后将无法恢复。';
            if (!confirm(confirmMsg)) {
                return;
            }

            timingTracker.start('revokeVc');

                // 添加800ms间隔
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const response = await fetch('/api/vc/revoke', {
                    method: 'POST',

                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({

                    })
                });

                        timingElement.classList.remove('timing-active');
                    }
                } else {

                // 错误情况下的时延显示
                const timingElement = document.getElementById('revokeVcTiming');
                if (timingElement && timingTracker.timings['revokeVc']) {
