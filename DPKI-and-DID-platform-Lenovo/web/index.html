<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPKI管理平台</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="language-switch.css">
    <script src="language.js"></script>
    <style>
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        
        .nav-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }
        
        .nav-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .nav-card-icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: block;
        }
        
        .nav-card-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .nav-card-desc {
            font-size: 1.1em;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .welcome-section {
            text-align: center;
            margin: 40px 0;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .welcome-title {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: white !important;
        }
        
        .welcome-desc {
            font-size: 1.2em;
            color: #e0e0e0;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .quick-status {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            min-width: 150px;
        }
        
        .status-card-label {
            font-size: 0.9em;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        
        .status-card-value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .warning-box {
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
            font-weight: 500;
        }
        
        .logs-section {
            margin: 30px 0;
        }
        
        .logs-container {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border-left: 3px solid #3498db;
        }
        
        .log-timestamp {
            color: #95a5a6;
            font-size: 0.8em;
            margin-right: 10px;
        }
        
        .log-message {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 data-lang-key="home_title">DPKI管理平台 - 分布式公钥基础设施管理系统</h1>
        </header>

        <!-- 欢迎区域 -->
        <div class="welcome-section">
            <div class="welcome-title" data-lang-key="welcome_title">欢迎使用DPKI平台</div>
            <div class="welcome-desc" style="color: white;" data-lang-key="welcome_desc">
                基于区块链的分布式公钥基础设施管理系统，提供安全可靠的数字证书管理和身份认证服务。
                选择下方功能模块开始管理您的CA和UE实体。
            </div>
        </div>

        <!-- 导航卡片 -->
        <div class="nav-cards">
            <a href="ca.html" class="nav-card">
                <div class="nav-card-icon">🏛️</div>
                <div class="nav-card-title" data-lang-key="dpki_platform_card_title">DPKI平台</div>
                <div class="nav-card-desc" data-lang-key="dpki_platform_card_desc">
                    基于区块链的分布式公钥基础设施管理系统，包括CA证书颁发机构管理和UE用户实体管理
                </div>
            </a>
            
            <a href="did.html" class="nav-card">
                <div class="nav-card-icon">🆔</div>
                <div class="nav-card-title" data-lang-key="did_platform_card_title">DID平台</div>
                <div class="nav-card-desc" data-lang-key="did_platform_card_desc">
                    去中心化身份标识管理平台，包括DID生成、DID文档查询、可验证凭证创建和验证等功能
                </div>
            </a>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
