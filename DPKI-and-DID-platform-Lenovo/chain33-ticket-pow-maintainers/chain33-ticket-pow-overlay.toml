# Chain33 ticket-mining overlay for a PoW-like maintainer chain.
# Merge these sections into a full Chain33 config that was built with
# github.com/33cn/plugin consensus modules.

[consensus]
name = "ticket"
minerstart = true
genesisBlockTime = 1514533394
genesis = "14KEKbYtKKQm4wMthSK9J4La4nAiidGozt"
minerExecs = ["ticket"]
enableBestBlockCmp = true

[consensus.sub.ticket]
coinReward = 18
coinDevFund = 12
ticketPrice = 10000
retargetAdjustmentFactor = 4
futureBlockTime = 16
ticketFrozenTime = 5
ticketWithdrawTime = 10
ticketMinerWaitTime = 2
maxTxNumber = 1600
targetTimespan = 2304
targetTimePerBlock = 16

[mver.consensus]
fundKeyAddr = "14KEKbYtKKQm4wMthSK9J4La4nAiidGozt"
powLimitBits = "0x1f00ffff"
maxTxNumber = 1600

[wallet.sub.ticket]
minerdisable = false
minerwhitelist = [
  "MAINTAINER_1_CHAIN33_ADDRESS",
  "MAINTAINER_2_CHAIN33_ADDRESS",
  "MAINTAINER_3_CHAIN33_ADDRESS",
  "MAINTAINER_4_CHAIN33_ADDRESS"
]

